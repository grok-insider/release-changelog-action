name: "AI release changelog"
description: "Generate Claude-Code-style release notes via OpenRouter, update CHANGELOG.md, and optionally publish GitHub Release notes."
author: "grok-insider"
branding:
  icon: "file-text"
  color: "purple"

inputs:
  version:
    description: "Version being released, e.g. 0.2.0 (no leading v)."
    required: true
  range:
    description: "git commit range, e.g. v0.1.0..HEAD. Default: since the last tag (or whole history)."
    required: false
    default: ""
  model:
    description: "OpenRouter model id."
    required: false
    default: "deepseek/deepseek-v4-flash-0731"
  changelog-file:
    description: "Path to the changelog file to update."
    required: false
    default: "CHANGELOG.md"
  openrouter-api-key:
    description: "OpenRouter API key. If empty, applies the selected fallback mode."
    required: false
    default: ""
  openrouter-base-url:
    description: "OpenRouter-compatible API base URL (override for a proxy/mirror)."
    required: false
    default: "https://openrouter.ai/api/v1"
  project-name:
    description: "Project name for prompt context. Defaults to the repository name."
    required: false
    default: ${{ github.event.repository.name }}
  project-description:
    description: "Optional one-line project description for prompt context."
    required: false
    default: ""
  heading-style:
    description: "Version heading format. keepachangelog (default) emits `## [X.Y.Z] - YYYY-MM-DD`; plain emits bare `## X.Y.Z`."
    required: false
    default: "keepachangelog"
  update-mode:
    description: "replace-section replaces/inserts the full version section; highlights only inserts/replaces `### Highlights` in an existing version section."
    required: false
    default: "replace-section"
  fallback-mode:
    description: "commit-list writes deterministic commit bullets when AI generation fails; preserve leaves the changelog unchanged."
    required: false
    default: "commit-list"
  commit-detail:
    description: "full sends commit subjects and bodies to OpenRouter; subjects sends subjects only."
    required: false
    default: "full"
  skip-generate:
    description: "If true, do not call OpenRouter or rewrite CHANGELOG.md; only extract + publish (requires publish-github-release)."
    required: false
    default: "false"
  publish-github-release:
    description: "If true, set the GitHub Release body from the CHANGELOG section (plus optional footer)."
    required: false
    default: "false"
  github-token:
    description: "Token for gh release edit/create when publish-github-release is true."
    required: false
    default: ""
  tag:
    description: "GitHub Release tag (e.g. v0.1.1). Defaults to v${version} when publishing."
    required: false
    default: ""
  notes-footer:
    description: "Optional markdown appended after the CHANGELOG section on the GitHub Release body."
    required: false
    default: ""
  notes-footer-file:
    description: "Optional path to a markdown file appended as the release footer (takes precedence over notes-footer when set)."
    required: false
    default: ""
  release-title:
    description: "GitHub Release title when publishing (default: tag)."
    required: false
    default: ""
  create-if-missing:
    description: "If true, create the GitHub Release when the tag has no release yet."
    required: false
    default: "true"

outputs:
  section-file:
    description: "Path to the generated candidate version section. Highlights mode extracts its bullets; preserved runs leave it empty."
    value: ${{ steps.run.outputs.section-file }}
  changed:
    description: "'true' if the changelog file content changed, else 'false'."
    value: ${{ steps.run.outputs.changed }}
  generation-source:
    description: "How release content was produced: ai, fallback, or preserved."
    value: ${{ steps.run.outputs.generation-source }}
  notes-file:
    description: "Path to the assembled GitHub Release notes (section body + footer), if built."
    value: ${{ steps.run.outputs.notes-file }}
  published:
    description: "'true' if a GitHub Release was created or edited with notes."
    value: ${{ steps.run.outputs.published }}

runs:
  using: "composite"
  steps:
    - id: run
      shell: bash
      env:
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        OPENROUTER_BASE_URL: ${{ inputs.openrouter-base-url }}
        CHANGELOG_MODEL: ${{ inputs.model }}
        CHANGELOG_FILE: ${{ inputs.changelog-file }}
        PROJECT_NAME: ${{ inputs.project-name }}
        PROJECT_DESCRIPTION: ${{ inputs.project-description }}
        HEADING_STYLE: ${{ inputs.heading-style }}
        UPDATE_MODE: ${{ inputs.update-mode }}
        FALLBACK_MODE: ${{ inputs.fallback-mode }}
        COMMIT_DETAIL: ${{ inputs.commit-detail }}
        VERSION: ${{ inputs.version }}
        RANGE: ${{ inputs.range }}
        SKIP_GENERATE: ${{ inputs.skip-generate }}
        PUBLISH_GITHUB_RELEASE: ${{ inputs.publish-github-release }}
        GITHUB_TOKEN_INPUT: ${{ inputs.github-token }}
        RELEASE_TAG: ${{ inputs.tag }}
        NOTES_FOOTER: ${{ inputs.notes-footer }}
        NOTES_FOOTER_FILE: ${{ inputs.notes-footer-file }}
        RELEASE_TITLE: ${{ inputs.release-title }}
        CREATE_IF_MISSING: ${{ inputs.create-if-missing }}
      run: |
        bash "${{ github.action_path }}/run-action.sh"
